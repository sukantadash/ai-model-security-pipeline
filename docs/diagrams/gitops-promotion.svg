<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 430" role="img" aria-label="GitOps promotion from score gate to model-test">
<rect x="0" y="0" width="1440" height="430" rx="0" fill="#F8F8F8" stroke="#F8F8F8" stroke-width="0"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#6A6E73"/></marker></defs>
<text x="40" y="40" fill="#151515" font-size="18" font-weight="700" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Promotion  |  auto-pass to model-test</text>
<text x="40" y="62" fill="#6A6E73" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">publish-artifact is the only pipeline write into verified storage and Model Registry. Production is manual.</text>
<rect x="40" y="100" width="220" height="90" rx="6" fill="#E7F1FA" stroke="#0066CC" stroke-width="1"/>
<text x="52" y="122" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">score-gate</text>
<text x="52" y="140" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">passed=true, routing=auto-pass</text>
<rect x="280" y="100" width="220" height="90" rx="6" fill="#E9F7E6" stroke="#3E8635" stroke-width="1"/>
<text x="292" y="122" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">publish-artifact</text>
<text x="292" y="140" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">mc mirror weights + POST registry</text>
<rect x="520" y="100" width="220" height="90" rx="6" fill="#E9F7E6" stroke="#3E8635" stroke-width="1"/>
<text x="532" y="122" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">models-verified</text>
<text x="532" y="140" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">s3://models-verified/&lt;id&gt;/&lt;ver&gt;/</text>
<rect x="760" y="100" width="220" height="90" rx="6" fill="#E9F7E6" stroke="#3E8635" stroke-width="1"/>
<text x="772" y="122" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Model Registry</text>
<text x="772" y="140" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">storage_uri + scan_uri + version</text>
<rect x="1000" y="100" width="220" height="90" rx="6" fill="#E9F7E6" stroke="#3E8635" stroke-width="1"/>
<text x="1012" y="122" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">OpenShift GitOps</text>
<text x="1012" y="140" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Argo CD Application</text>
<rect x="1240" y="100" width="220" height="90" rx="6" fill="#E9F7E6" stroke="#3E8635" stroke-width="1"/>
<text x="1252" y="122" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">model-test</text>
<text x="1252" y="140" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">LLMInferenceService / vLLM</text>
<line x1="260" y1="145" x2="280" y2="145" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="500" y1="145" x2="520" y2="145" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="740" y1="145" x2="760" y2="145" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="980" y1="145" x2="1000" y2="145" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="1220" y1="145" x2="1240" y2="145" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="230" width="340" height="90" rx="6" fill="#FFF5F5" stroke="#C9190B" stroke-width="1"/>
<text x="52" y="252" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Reject / review</text>
<text x="52" y="270" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">No publish. archive-results still runs.</text>
<rect x="400" y="230" width="340" height="90" rx="6" fill="#E7F1FA" stroke="#0066CC" stroke-width="1"/>
<text x="412" y="252" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tekton Chains</text>
<text x="412" y="270" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">SLSA on PipelineRun. Cosign / KMS.</text>
<rect x="760" y="230" width="340" height="90" rx="6" fill="#F5F5F5" stroke="#D2D2D2" stroke-width="1"/>
<text x="772" y="252" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">model-prod</text>
<text x="772" y="270" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Not a pipeline output. Manual later.</text>
<rect x="1120" y="230" width="280" height="90" rx="6" fill="#F5F5F5" stroke="#D2D2D2" stroke-width="1"/>
<text x="1132" y="252" fill="#151515" font-size="12" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Observability</text>
<text x="1132" y="270" fill="#6A6E73" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Prometheus, Grafana, KEDA.</text>
<text x="40" y="360" fill="#6A6E73" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">GitOps manifests: instances/gitops/application-model-test.yaml + instances/model-test/llm-models/.</text>
<text x="40" y="382" fill="#6A6E73" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Serving reads MinIO models-verified, not Hugging Face. Test-zone NetworkPolicy is intended to deny Hub egress.</text>
</svg>
