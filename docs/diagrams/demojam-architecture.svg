<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-label="DemoJam architecture: zero-trust AI model security pipeline on OpenShift and OpenShift AI">
  <rect width="1440" height="810" fill="#F8F8F8"/>

  <text x="48" y="46" fill="#151515" font-size="22" font-weight="700" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Zero-Trust LLM Intake  -  OpenShift + OpenShift AI</text>
  <text x="48" y="70" fill="#6A6E73" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Untrusted Hugging Face / vendor weights are gated, scored, signed, then served only if they pass. Fail closed.</text>

  <rect x="980" y="28" width="92" height="28" rx="4" fill="#EE0000"/>
  <text x="1026" y="47" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">OpenShift</text>
  <rect x="1080" y="28" width="118" height="28" rx="4" fill="#0066CC"/>
  <text x="1139" y="47" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">OpenShift AI</text>
  <rect x="1206" y="28" width="70" height="28" rx="4" fill="#151515"/>
  <text x="1241" y="47" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">RHEL</text>
  <rect x="1284" y="28" width="108" height="28" rx="4" fill="#3D2C29"/>
  <text x="1338" y="47" text-anchor="middle" fill="#fff" font-size="11" font-weight="600" font-family="system-ui, sans-serif">GitOps / Quay</text>

  <!-- Ingress -->
  <rect x="32" y="96" width="280" height="656" rx="10" fill="#fff" stroke="#C9190B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="52" y="128" fill="#C9190B" font-size="15" font-weight="700" font-family="system-ui, sans-serif">1. Ingress Zone</text>
  <text x="52" y="148" fill="#6A6E73" font-size="12" font-family="system-ui, sans-serif">OpenShift project: model-ingress</text>
  <text x="52" y="166" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Untrusted artifact intake. No trust.</text>

  <rect x="52" y="188" width="240" height="72" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="68" y="216" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Model hubs / vendors</text>
  <text x="68" y="236" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Hugging Face, third-party GGUF / Safetensors / PyTorch</text>

  <rect x="52" y="276" width="240" height="72" rx="6" fill="#FFF5F5" stroke="#C9190B"/>
  <text x="68" y="304" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Envoy ingress</text>
  <text x="68" y="324" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Rate limit  |  egress blockade  |  NetworkPolicy</text>

  <rect x="52" y="364" width="240" height="72" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="68" y="392" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Ingress object store</text>
  <text x="68" y="412" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">MinIO s3://models-ingress  |  RHEL UBI fetch image</text>

  <rect x="52" y="456" width="240" height="88" rx="6" fill="#FFF5F5" stroke="#C9190B"/>
  <text x="68" y="484" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Tekton Trigger</text>
  <text x="68" y="504" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Upload fires a PipelineRun</text>
  <text x="68" y="522" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">OpenShift Pipelines EventListener</text>

  <text x="172" y="580" text-anchor="middle" fill="#C9190B" font-size="11" font-weight="600" font-family="system-ui, sans-serif">artifact event -></text>

  <!-- Evaluation -->
  <rect x="332" y="96" width="720" height="656" rx="10" fill="#fff" stroke="#0066CC" stroke-width="2"/>
  <text x="352" y="128" fill="#0066CC" font-size="15" font-weight="700" font-family="system-ui, sans-serif">2. Evaluation Zone   |   OpenShift Pipelines sandbox</text>
  <text x="352" y="148" fill="#6A6E73" font-size="12" font-family="system-ui, sans-serif">OpenShift project: model-eval   |   no public egress   |   restricted SCC   |   Sandboxed Containers (Kata) for runtime probes</text>

  <rect x="352" y="172" width="168" height="86" rx="6" fill="#E7F1FA" stroke="#0066CC"/>
  <text x="368" y="196" fill="#151515" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Static scan</text>
  <text x="368" y="214" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">Malware  |  CVE  |  license</text>
  <text x="368" y="230" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">ModelAudit, Fickling, ClamAV, Syft/Grype</text>
  <text x="368" y="246" fill="#0066CC" font-size="10" font-weight="600" font-family="system-ui, sans-serif">40% of S_total</text>

  <rect x="536" y="172" width="168" height="86" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="552" y="196" fill="#151515" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Dynamic scan</text>
  <text x="552" y="214" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">Kata  |  Falco  |  Kepler  |  vLLM</text>
  <text x="552" y="230" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">Isolation, behavior, resources</text>
  <text x="552" y="246" fill="#C9190B" font-size="10" font-weight="600" font-family="system-ui, sans-serif">Hard gate (not scored)</text>

  <rect x="720" y="172" width="168" height="86" rx="6" fill="#E7F1FA" stroke="#0066CC"/>
  <text x="736" y="196" fill="#151515" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Capability eval</text>
  <text x="736" y="214" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">Quality  |  cost  |  stability  |  bias</text>
  <text x="736" y="230" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">GPU nodeSelector  |  RHEL UBI</text>
  <text x="736" y="246" fill="#0066CC" font-size="10" font-weight="600" font-family="system-ui, sans-serif">35% of S_total</text>

  <rect x="904" y="172" width="124" height="86" rx="6" fill="#E7F1FA" stroke="#0066CC"/>
  <text x="916" y="196" fill="#151515" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Adversarial</text>
  <text x="916" y="214" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">Injection  |  jailbreak</text>
  <text x="916" y="230" fill="#6A6E73" font-size="10" font-family="system-ui, sans-serif">Harmful content / bias</text>
  <text x="916" y="246" fill="#0066CC" font-size="10" font-weight="600" font-family="system-ui, sans-serif">25% of S_total</text>

  <rect x="352" y="278" width="676" height="196" rx="8" fill="#F0F0F0"/>
  <text x="372" y="306" fill="#151515" font-size="13" font-weight="700" font-family="system-ui, sans-serif">OpenShift Pipelines DAG (parallel subtasks, then merge)</text>
  <text x="372" y="328" fill="#6A6E73" font-size="12" font-family="system-ui, sans-serif">fetch -> static (3) -> dynamic (4) -> capability (4) -> adversarial (3) -> score-gate -> publish</text>
  <text x="372" y="352" fill="#6A6E73" font-size="12" font-family="system-ui, sans-serif">S_total = 0.40*S_static + 0.35*S_capability + 0.25*S_redteam      |      dynamic-scan critical/high = reject</text>

  <rect x="372" y="372" width="196" height="78" rx="6" fill="#3E8635"/>
  <text x="470" y="404" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="system-ui, sans-serif">Score 85  Auto-pass</text>
  <text x="470" y="426" text-anchor="middle" fill="#fff" font-size="11" font-family="system-ui, sans-serif">Sign, promote, serve</text>

  <rect x="580" y="372" width="196" height="78" rx="6" fill="#F0AB00"/>
  <text x="678" y="404" text-anchor="middle" fill="#151515" font-size="16" font-weight="700" font-family="system-ui, sans-serif">70-84  Review</text>
  <text x="678" y="426" text-anchor="middle" fill="#151515" font-size="11" font-family="system-ui, sans-serif">Pipeline succeeds, no publish</text>

  <rect x="788" y="372" width="216" height="78" rx="6" fill="#C9190B"/>
  <text x="896" y="404" text-anchor="middle" fill="#fff" font-size="16" font-weight="700" font-family="system-ui, sans-serif">&lt; 70 / hard gate  Reject</text>
  <text x="896" y="426" text-anchor="middle" fill="#fff" font-size="11" font-family="system-ui, sans-serif">Weights stay in ingress / eval</text>

  <rect x="352" y="494" width="328" height="112" rx="6" fill="#E7F1FA" stroke="#0066CC"/>
  <text x="368" y="522" fill="#151515" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Score gate + Tekton Chains</text>
  <text x="368" y="544" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Policy-as-code thresholds  |  SLSA provenance</text>
  <text x="368" y="562" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Cosign attestations on the PipelineRun</text>
  <text x="368" y="580" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Fail closed: no signed artifact on reject</text>

  <rect x="696" y="494" width="332" height="112" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="712" y="522" fill="#151515" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Scanner images on RHEL UBI 9</text>
  <text x="712" y="544" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Built on-cluster (BuildConfig) -> Quay</text>
  <text x="712" y="562" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">fetch  |  static  |  dynamic  |  capability</text>
  <text x="712" y="580" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">adversarial  |  score-gate  |  publish</text>

  <text x="692" y="640" text-anchor="middle" fill="#0066CC" font-size="12" font-weight="600" font-family="system-ui, sans-serif">signed, scored artifact -></text>
  <text x="692" y="720" text-anchor="middle" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Tasks run isolated: DNS-only dynamic probes  |  no east-west except approved S3 paths</text>

  <!-- Test / OpenShift AI -->
  <rect x="1072" y="96" width="336" height="656" rx="10" fill="#fff" stroke="#3E8635" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1092" y="128" fill="#3E8635" font-size="15" font-weight="700" font-family="system-ui, sans-serif">3. Test Zone</text>
  <text x="1092" y="148" fill="#6A6E73" font-size="12" font-family="system-ui, sans-serif">OpenShift AI  |  model-test</text>
  <text x="1092" y="166" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Only auto-pass models arrive here.</text>

  <rect x="1092" y="188" width="296" height="72" rx="6" fill="#E9F7E6" stroke="#3E8635"/>
  <text x="1108" y="216" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">RHOAI Model Registry</text>
  <text x="1108" y="236" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Version, storage_uri, scan_uri, RBAC</text>

  <rect x="1092" y="276" width="296" height="72" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="1108" y="304" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Quay + Cosign</text>
  <text x="1108" y="324" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Scanner images  |  signature verify at pull</text>

  <rect x="1092" y="364" width="296" height="72" rx="6" fill="#E9F7E6" stroke="#3E8635"/>
  <text x="1108" y="392" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">OpenShift GitOps (Argo CD)</text>
  <text x="1108" y="412" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Declarative LLMInferenceService sync</text>

  <rect x="1092" y="452" width="296" height="72" rx="6" fill="#E9F7E6" stroke="#3E8635"/>
  <text x="1108" y="480" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">KServe + vLLM on OpenShift AI</text>
  <text x="1108" y="500" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Live chat only after the gate passes</text>

  <rect x="1092" y="540" width="296" height="72" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="1108" y="568" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">KEDA + observability</text>
  <text x="1108" y="588" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">GPU / queue scale  |  Prometheus / Grafana</text>

  <rect x="1092" y="628" width="296" height="92" rx="6" fill="#F5F5F5" stroke="#D2D2D2"/>
  <text x="1108" y="656" fill="#151515" font-size="13" font-weight="600" font-family="system-ui, sans-serif">model-prod (later, manual)</text>
  <text x="1108" y="676" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Demo stops at signed test serving.</text>
  <text x="1108" y="694" fill="#6A6E73" font-size="11" font-family="system-ui, sans-serif">Production promotion is a human step.</text>
</svg>
