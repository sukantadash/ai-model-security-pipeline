<text x="40" y="540" fill="#6A6E73" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Eval may reach ingress namespace (artifact sync). Test must not reach Hugging Face. Catch-all :443 ipBlocks are the Quay/TLS hole to pin later.</text>
<text x="40" y="562" fill="#6A6E73" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Dynamic-scan pods: tighter intent (DNS only during probe). Today RUNTIME_CLASS=kata is env; podTemplate.runtimeClassName is not set.</text>
