apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: model-security-template
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  params:
    - name: model-id
    - name: modelcar-image
    - name: serving-yaml
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: model-security-
      spec:
        pipelineRef:
          name: model-security-pipeline
        taskRunTemplate:
          serviceAccountName: model-eval-pipeline
        params:
          - name: model-id
            value: $(tt.params.model-id)
          - name: modelcar-image
            value: $(tt.params.modelcar-image)
          - name: model-path
            value: /workspace/models
          - name: model-registry-namespace
            value: rhoai-model-registries
          - name: git-url
            value: https://github.com/arckrish/ai-model-security-pipeline.git
          - name: model-sandbox-path
            value: instances/model-sandbox/LLMInferenceService.yaml
          - name: serving-yaml
            value: $(tt.params.serving-yaml)
        workspaces:
          - name: shared-data
            persistentVolumeClaim:
              claimName: eval-workspace
          - name: results
            emptyDir: {}
