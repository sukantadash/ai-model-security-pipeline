# Replace REPLACE_WITH_CLUSTER_APPS_DOMAIN before overlay 13 (see script.sh Phase 12).
#   APPS_DOMAIN=$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')
#   hostname: inference-gateway.${APPS_DOMAIN}
# APPS_DOMAIN already includes the apps. prefix (e.g. apps.cluster.example.com).
# model-test is the verified-model serving namespace after pipeline pass; do not add hf:// demo namespaces here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  labels:
    istio.io/rev: openshift-gateway
  name: openshift-ai-inference
  namespace: openshift-ingress
spec:
  gatewayClassName: openshift-ai-inference
  listeners:
    - allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - model-test
      hostname: inference-gateway.REPLACE_WITH_CLUSTER_APPS_DOMAIN
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ''
            kind: Secret
            name: openshift-ai-inference-tls
        mode: Terminate
