# model-test serving pods (storage-initializer) query Model Registry REST via kube-rbac-proxy.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-test-serving-registry-user
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    app.kubernetes.io/name: model-test-serving-registry-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-user-model-registry
subjects:
  - kind: Group
    name: system:serviceaccounts:model-test
    apiGroup: rbac.authorization.k8s.io
