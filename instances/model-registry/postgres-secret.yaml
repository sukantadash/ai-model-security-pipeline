# Replace the password before apply — or create via:
#   oc create secret generic model-registry-db -n rhoai-model-registries \
#     --from-literal=database-name=model-registry \
#     --from-literal=database-user=modelregistryuser \
#     --from-literal=database-password='<strong-password>'
apiVersion: v1
kind: Secret
metadata:
  name: model-registry-db
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/name: model-registry-db
    app.kubernetes.io/part-of: ai-model-security-pipeline
type: Opaque
stringData:
  database-name: model-registry
  database-user: modelregistryuser
  database-password: CHANGE_ME_MODEL_REGISTRY_DB_PASSWORD
