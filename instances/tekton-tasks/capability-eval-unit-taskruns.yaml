apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: unit-capability-quality-
  labels:
    test: capability-eval-unit
    ai.security.pipeline/stage: capability-eval
spec:
  serviceAccountName: model-eval-pipeline
  taskRef:
    name: capability-eval-quality
  workspaces:
  - name: models
    configMap:
      name: fixture-capability-quality
  - name: results
    emptyDir: {}
  params:
  - name: model-id
    value: unit-test
  - name: pipeline-run-name
    value: model-security-unit1
---
