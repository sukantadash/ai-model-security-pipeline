apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-artifact
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  description: >
    Extract /models from the unverified ModelCar image onto the pipeline workspace
    (static scanners need a filesystem tree; weights are not synced from MinIO).
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    - name: model-id
      type: string
    - name: modelcar-image
      type: string
      description: Shared ModelCar repository (tag is model-id-unverified)
    - name: model-path
      type: string
      default: /workspace/models
  results:
    - name: model-path
  workspaces:
    - name: models
  volumes:
    - name: quay-auth
      secret:
        secretName: sudash-modelpipeline-pull-secret
        optional: true
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: extract
      image: $(params.image)
      imagePullPolicy: IfNotPresent
      env:
        - name: MODELCAR_IMAGE
          value: $(params.modelcar-image)
        - name: MODEL_ID
          value: $(params.model-id)
        - name: REGISTRY_AUTH_FILE
          value: /run/secrets/quay/config.json
        - name: DOCKER_CONFIG
          value: /run/secrets/quay
      volumeMounts:
        - name: quay-auth
          mountPath: /run/secrets/quay
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        DEST="$(workspaces.models.path)"
        IMG="${MODELCAR_IMAGE}:${MODEL_ID}-unverified"
        # Large single-layer ModelCars (~9 GB) can drop mid-download from quay.io
        # ("unexpected EOF"). Retry the whole extract with a clean destination.
        ATTEMPTS="${EXTRACT_ATTEMPTS:-4}"
        for i in $(seq 1 "${ATTEMPTS}"); do
          rm -rf "${DEST:?}"/* "${DEST:?}"/.[!.]* 2>/dev/null || true
          mkdir -p "${DEST}"
          echo "Extracting /models from ${IMG} (attempt ${i}/${ATTEMPTS})"
          if oc image extract "${IMG}" --path /models/:${DEST}/ --confirm; then
            break
          fi
          if [[ "${i}" -eq "${ATTEMPTS}" ]]; then
            echo "extract failed after ${ATTEMPTS} attempts" >&2
            exit 1
          fi
          sleep $((i * 20))
        done
        if [[ -z "$(ls -A "${DEST}" 2>/dev/null || true)" ]]; then
          # Some extract layouts nest under models/
          if [[ -d "${DEST}/models" ]] && [[ -n "$(ls -A "${DEST}/models" 2>/dev/null || true)" ]]; then
            shopt -s dotglob
            mv "${DEST}/models"/* "${DEST}/"
            rmdir "${DEST}/models" 2>/dev/null || true
          fi
        fi
        if [[ ! -d "${DEST}" ]] || [[ -z "$(ls -A "${DEST}" 2>/dev/null || true)" ]]; then
          echo "no model files after extract from ${IMG}" >&2
          ls -la "${DEST}" >&2 || true
          exit 1
        fi
        echo -n "${DEST}" > "$(results.model-path.path)"
        echo "extracted $(params.model-id) to ${DEST}"