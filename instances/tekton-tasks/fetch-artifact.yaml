apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-artifact
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  description: >
    Extract /models from the unverified ModelCar image onto the pipeline workspace
    (static scanners need a filesystem tree; weights are not synced from MinIO).
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    - name: model-id
      type: string
    - name: modelcar-image
      type: string
      description: Shared ModelCar repository (tag is model-id-unverified)
    - name: model-path
      type: string
      default: /workspace/models
  results:
    - name: model-path
  workspaces:
    - name: models
  volumes:
    - name: quay-auth
      secret:
        secretName: sudash-modelpipeline-pull-secret
        optional: false
        items:
          - key: .dockerconfigjson
            path: config.json
  steps:
    - name: extract
      image: $(params.image)
      imagePullPolicy: IfNotPresent
      env:
        - name: MODELCAR_IMAGE
          value: $(params.modelcar-image)
        - name: MODEL_ID
          value: $(params.model-id)
        - name: REGISTRY_AUTH_FILE
          value: /run/secrets/quay/config.json
        - name: DOCKER_CONFIG
          value: /run/secrets/quay
      volumeMounts:
        - name: quay-auth
          mountPath: /run/secrets/quay
          readOnly: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        DEST="$(workspaces.models.path)"
        IMG="${MODELCAR_IMAGE}:${MODEL_ID}-unverified"
        mkdir -p "${DEST}"
        # Clear previous weights without failing on an empty dir (set -e + glob).
        find "${DEST}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        echo "Extracting /models from ${IMG} -> ${DEST}"
        df -h "${DEST}" || true
        if ! oc image extract "${IMG}" --path "/models/:${DEST}/" --confirm; then
          echo "oc image extract failed for ${IMG}" >&2
          ls -la /run/secrets/quay >&2 || true
          exit 1
        fi
        if [[ -d "${DEST}/models" ]] && [[ -n "$(ls -A "${DEST}/models" 2>/dev/null || true)" ]]; then
          shopt -s dotglob nullglob
          mv "${DEST}/models"/* "${DEST}/"
          rmdir "${DEST}/models" 2>/dev/null || true
        fi
        COUNT="$(find "${DEST}" -type f ! -path '*/.cache/*' | wc -l | tr -d ' ')"
        if [[ "${COUNT}" -lt 1 ]]; then
          echo "no model files after extract from ${IMG}" >&2
          ls -la "${DEST}" >&2 || true
          exit 1
        fi
        du -sh "${DEST}" || true
        echo -n "${DEST}" > "$(results.model-path.path)"
        echo "extracted $(params.model-id) (${COUNT} files) to ${DEST}"
