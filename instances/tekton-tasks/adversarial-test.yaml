apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: adversarial-test-merge
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: adversarial-test
spec:
  description: Merge three adversarial-test finding files into adversarial-test.json. Always succeeds; findings stay on the
    PVC.
  params:
  - name: image
    type: string
    default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-adversarial-test:latest
  - name: model-id
    type: string
    default: unit-test
  - name: pipeline-run-name
    type: string
    default: ''
  - name: model-endpoint
    type: string
    default: ''
  results:
  - name: result-file
    description: Path to merged adversarial-test findings JSON
  workspaces:
  - name: results
  steps:
  - name: download
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    imagePullPolicy: IfNotPresent
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      s3_fetch_scan_prefix "${MODEL_ID}" "${VERSION}" "$(workspaces.results.path)"
  - name: merge
    image: $(params.image)
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      OUT="$(workspaces.results.path)/adversarial-test.json"
      RESULTS="$(workspaces.results.path)"
      python3 - "${RESULTS}" "${OUT}" <<'PY'
      import json, sys
      from pathlib import Path
      FILES = {
          "prompt-injection": "adversarial-prompt-injection.json",
          "jailbreak-guardrail-bypass": "adversarial-jailbreak-guardrail-bypass.json",
          "harmful-content-bias": "adversarial-harmful-content-bias.json",
      }
      results, out = Path(sys.argv[1]), Path(sys.argv[2])
      merged = []
      try:
          for subtask, filename in FILES.items():
              path = results / filename
              nested = results / "adversarial-test" / f"{subtask}.json"
              if not path.exists() and nested.exists():
                  path = nested
              if not path.exists():
                  merged.append({
                      "issue": f"subtask {subtask} produced no findings file",
                      "risk": "critical",
                      "tool_used": "adversarial-test",
                      "task": "adversarial-test",
                      "subtask": subtask,
                  })
                  continue
              try:
                  payload = json.loads(path.read_text() or "[]")
              except json.JSONDecodeError as exc:
                  merged.append({
                      "issue": f"subtask {subtask} findings are not valid JSON: {exc}",
                      "risk": "critical",
                      "tool_used": "adversarial-test",
                      "task": "adversarial-test",
                      "subtask": subtask,
                  })
                  continue
              if isinstance(payload, dict):
                  payload = payload.get("issues") or [payload]
              if isinstance(payload, list):
                  merged.extend(payload)
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(merged, indent=2) + "\n")
          print(out.read_text())
      except Exception as exc:
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps([{
              "issue": f"adversarial-test merge failed: {exc}",
              "risk": "critical",
              "tool_used": "adversarial-test",
              "task": "adversarial-test",
              "subtask": "merge",
          }], indent=2) + "\n")
          print(out.read_text())
      PY
      echo -n "${OUT}" > "$(results.result-file.path)"
  - name: upload
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    imagePullPolicy: IfNotPresent
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      FILE="$(workspaces.results.path)/adversarial-test.json"
      s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${FILE}"
