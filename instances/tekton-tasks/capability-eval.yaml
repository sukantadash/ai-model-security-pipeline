apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: capability-eval-quality
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: capability-eval
spec:
  description: Capability-eval subtask — quality testing (MMLU, GSM8K, HumanEval).
  params:
  - name: image
    type: string
    default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-capability-eval:latest
  - name: scores-file
    type: string
    default: quality-scores.json
  - name: model-id
    type: string
    default: unit-test
  - name: pipeline-run-name
    type: string
    default: ''
  - name: model-endpoint
    type: string
    default: ''
  results:
  - name: result-file
    description: Path to quality findings JSON
  workspaces:
  - name: models
  - name: results
  steps:
  - name: evaluate
    image: $(params.image)
    env:
    - name: MODEL_ENDPOINT
      value: $(params.model-endpoint)
    - name: MODEL_NAME
      value: $(params.model-id)
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      trap 'echo $? > "$(workspaces.results.path)/.step-rc"' EXIT
      OUT="$(workspaces.results.path)/capability-quality.json"
      SCORES="$(workspaces.models.path)/$(params.scores-file)"
      /scripts/run-quality.sh "${OUT}" "${SCORES}"
      echo -n "${OUT}" > "$(results.result-file.path)"
    onError: continue
  - name: upload
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      FILE="$(workspaces.results.path)/capability-quality.json"
      s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${FILE}"
  - name: fail-if-prior-failed
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      rc="$(cat "$(workspaces.results.path)/.step-rc" 2>/dev/null || echo 1)"
      exit "${rc}"
---
