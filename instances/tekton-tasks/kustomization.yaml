apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Duplicate of builds/publish/scripts/register_model.py (kustomize cannot
  # load files outside this directory). Keep in sync via assert_copies_match.py.
  - name: publish-register-model
    files:
      - register_model.py

resources:
  - fetch-artifact.yaml
  - static-scan.yaml
  - serve-llm.yaml
  - dynamic-scan.yaml
  - capability-eval.yaml
  - adversarial-test.yaml
  - score-gate.yaml
  - archive-results.yaml
  - publish-artifact.yaml
