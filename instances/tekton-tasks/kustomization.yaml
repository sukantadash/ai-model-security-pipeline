apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: publish-register-model
    files:
      - register_model.py

resources:
  - fetch-artifact.yaml
  - static-scan.yaml
  - serve-llm.yaml
  - dynamic-scan.yaml
  - capability-eval.yaml
  - adversarial-test.yaml
  - score-gate.yaml
  - archive-results.yaml
  - publish-artifact.yaml
