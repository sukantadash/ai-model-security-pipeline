apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dynamic-probe
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  description: Kata-isolated metadata probe (no GPU load).
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-dynamic-test:latest
    - name: model-path
      type: string
      default: /workspace/models
  workspaces:
    - name: models
    - name: results
  steps:
    - name: probe
      image: $(params.image)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        OUT="$(workspaces.results.path)/dynamic-probe.json"
        /scripts/run-dynamic-probe.sh "$(workspaces.models.path)" "${OUT}"
