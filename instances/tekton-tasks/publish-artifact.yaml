apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-artifact
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: publish-artifact
spec:
  description: >
    Retag ModelCar model-id-unverified → model-id-verified-SCORE-VERSION, register in
    RHOAI Model Registry, apply overlays/16-test-serving (NetworkPolicies +
    LLMInferenceServiceConfig), then apply the caller-supplied serving YAML after
    replacing only the placeholder image URI.
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    - name: model-id
      type: string
    - name: modelcar-image
      type: string
      description: Shared ModelCar repository (Quay)
    - name: model-registry-namespace
      type: string
      default: rhoai-model-registries
    - name: pipeline-run-name
      type: string
    - name: git-url
      type: string
      default: ''
    - name: serving-yaml
      type: string
      default: instances/model-test/qwen3-8b-fp8-verified.yaml
      description: File path in git-url to LLMInferenceService YAML (placeholder image only)
    - name: git-revision
      type: string
      default: ''
    - name: test-namespace
      type: string
      default: model-test
  results:
    - name: published-uri
    - name: model-version
    - name: scan-uri
  workspaces:
    - name: models
  volumes:
    - name: scratch
      emptyDir: {}
    - name: register-model
      configMap:
        name: publish-register-model
        defaultMode: 0555
    - name: quay-auth
      secret:
        secretName: sudash-modelpipeline-pull-secret
        optional: true
        items:
          - key: .dockerconfigjson
            path: .dockerconfigjson
  stepTemplate:
    volumeMounts:
      - name: scratch
        mountPath: /scratch
  steps:
    - name: publish
      image: $(params.image)
      imagePullPolicy: Always
      volumeMounts:
        - name: register-model
          mountPath: /opt/register
          readOnly: true
        - name: quay-auth
          mountPath: /run/secrets/quay
          readOnly: true
      envFrom:
        - secretRef:
            name: minio-s3
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source /scripts/s3-common.sh
        MODEL_ID="$(params.model-id)"
        MODELCAR_IMAGE="$(params.modelcar-image)"
        MR_NS="$(params.model-registry-namespace)"
        MR_URL="${MODEL_REGISTRY_URL:-https://model-registry.${MR_NS}.svc:8443}"
        PR="$(params.pipeline-run-name)"
        if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
        VERSION="$(model_version_from_run "${PR}")"
        DEST="/tmp/scan-result"
        s3_fetch_scan_prefix "${MODEL_ID}" "${VERSION}" "${DEST}" >/dev/null
        SCAN_URI=$(s3_scan_result_uri "${MODEL_ID}" "${VERSION}")
        SCORE_FILE="${DEST}/score.json"

        if [[ ! -f "${SCORE_FILE}" ]]; then
          echo "score.json missing at ${SCAN_URI}; refusing promote" >&2
          exit 1
        fi
        PASSED="$(jq -r '.passed // false' "${SCORE_FILE}")"
        ROUTING="$(jq -r '.routing // empty' "${SCORE_FILE}")"
        if [[ "${ROUTING}" != "auto-pass" && "${ROUTING}" != "review" ]]; then
          echo "refusing promote: passed=${PASSED} routing=${ROUTING}" >&2
          exit 1
        fi

        SCORE_RAW="$(jq -r '.score // .S_total // 0' "${SCORE_FILE}")"
        SCORE_TAG="$(python3 -c "print(int(round(float('${SCORE_RAW}'))))")"
        SRC_IMG="${MODELCAR_IMAGE}:${MODEL_ID}-unverified"
        DST_IMG="${MODELCAR_IMAGE}:${MODEL_ID}-verified-${SCORE_TAG}-${VERSION}"
        AUTHFILE=/tmp/auth.json
        if [[ -f /run/secrets/quay/.dockerconfigjson ]]; then
          cp /run/secrets/quay/.dockerconfigjson "${AUTHFILE}"
          export REGISTRY_AUTH_FILE="${AUTHFILE}"
        fi
        echo "Retagging ${SRC_IMG} -> ${DST_IMG}"
        skopeo copy --quiet "docker://${SRC_IMG}" "docker://${DST_IMG}"
        PUBLISHED_URI="oci://${DST_IMG}"
        echo "Published ModelCar ${PUBLISHED_URI} (routing=${ROUTING} score=${SCORE_TAG})"

        export MR_URL PUBLISHED_URI SCAN_URI VERSION ROUTING MODEL_ID
        # Back-compat env name for register_model.py
        export S3_URI="${PUBLISHED_URI}"
        python3 /opt/register/register_model.py

        python3 - <<PY
        import json
        payload = {
          "status": "${ROUTING}",
          "routing": "${ROUTING}",
          "published_uri": "${PUBLISHED_URI}",
          "scan_uri": "${SCAN_URI}",
          "model_registry_namespace": "${MR_NS}",
          "model_version": "${VERSION}",
          "modelcar_image": "${DST_IMG}",
          "score": ${SCORE_TAG},
        }
        with open("${DEST}/publish.json", "w") as fh:
            json.dump(payload, fh, indent=2)
        print(json.dumps(payload))
        PY
        s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${DEST}/publish.json"
        echo -n "${PUBLISHED_URI}" > "$(results.published-uri.path)"
        echo -n "${VERSION}" > "$(results.model-version.path)"
        echo -n "${SCAN_URI}" > "$(results.scan-uri.path)"
        printf '%s' "${PUBLISHED_URI}" > /scratch/published-uri
    - name: clone-patch-test
      image: $(params.image)
      imagePullPolicy: Always
      env:
      - name: GIT_TOKEN
        valueFrom:
          secretKeyRef:
            name: git-auth
            key: token
            optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        GIT_URL="$(params.git-url)"
        if [[ -z "${GIT_URL}" ]]; then
          echo "git-url empty; skipping model-test LLMInferenceService apply" >&2
          exit 0
        fi
        URI="$(cat /scratch/published-uri)"
        OUT="/scratch/patched-test"
        APPLY="/scratch/patched-test-apply"
        STAGE="/scratch/test-serving"
        rm -rf "${OUT}" "${APPLY}" "${STAGE}"
        mkdir -p "${APPLY}"
        export GIT_URL
        export GIT_PATH="$(params.serving-yaml)"
        export GIT_REVISION="$(params.git-revision)"
        export OUT_DIR="${OUT}"
        export MODEL_URI="${URI}"
        export NAMESPACE="$(params.test-namespace)"
        export TEST_SERVING_OUT="${STAGE}"
        /scripts/clone-and-patch-llmis.sh
        cp -a "${OUT}/." "${APPLY}/"
    - name: apply-test
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      imagePullPolicy: IfNotPresent
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.test-namespace)"
        OVERLAY="/scratch/test-serving/overlays/16-test-serving"
        DIR="/scratch/patched-test-apply"
        # LLMInferenceServiceConfig + zone NetworkPolicies (same as oc apply -k overlays/16-test-serving/).
        # Must land before the verified LLMIS so baseRefs resolve and the workload can start.
        if [[ -d "${OVERLAY}" ]]; then
          oc apply -k "${OVERLAY}"
          echo "applied overlays/16-test-serving (LLMInferenceServiceConfig + NetworkPolicies) in ${NS}"
        else
          echo "overlays/16-test-serving not staged; skip (git-url empty or clone skipped)" >&2
        fi
        if [[ ! -d "${DIR}" ]] || [[ -z "$(ls -A "${DIR}" 2>/dev/null || true)" ]]; then
          echo "no patched model-test YAML; skip apply" >&2
          exit 0
        fi
        oc apply -n "${NS}" -f "${DIR}"
        echo "applied LLMInferenceService in ${NS} from $(params.serving-yaml)"
