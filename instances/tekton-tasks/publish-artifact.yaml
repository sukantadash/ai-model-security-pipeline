apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: publish-artifact
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: publish-artifact
spec:
  description: >
    Promote model weights to MinIO models-verified, register in
    RHOAI Model Registry, and apply the patched LLMInferenceService in model-test
    when score-gate routing is auto-pass or review.
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    - name: model-id
      type: string
    - name: model-registry-namespace
      type: string
      default: rhoai-model-registries
    - name: pipeline-run-name
      type: string
    - name: git-url
      type: string
      default: ''
    - name: model-test-path
      type: string
      default: instances/model-test/llm-models
    - name: git-revision
      type: string
      default: ''
    - name: test-namespace
      type: string
      default: model-test
  results:
    - name: published-uri
    - name: model-version
    - name: scan-uri
  workspaces:
    - name: models
  volumes:
    - name: scratch
      emptyDir: {}
    - name: register-model
      configMap:
        name: publish-register-model
        defaultMode: 0555
  stepTemplate:
    volumeMounts:
      - name: scratch
        mountPath: /scratch
  steps:
    - name: publish
      image: $(params.image)
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: register-model
          mountPath: /opt/register
          readOnly: true
      envFrom:
        - secretRef:
            name: minio-s3
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        source /scripts/s3-common.sh
        MODEL_ID="$(params.model-id)"
        MODEL_PATH="$(workspaces.models.path)"
        MR_NS="$(params.model-registry-namespace)"
        MR_URL="${MODEL_REGISTRY_URL:-https://model-registry.${MR_NS}.svc:8443}"
        PR="$(params.pipeline-run-name)"
        if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
        VERSION="$(model_version_from_run "${PR}")"
        DEST="/tmp/scan-result"
        s3_fetch_scan_prefix "${MODEL_ID}" "${VERSION}" "${DEST}" >/dev/null
        SCAN_URI=$(s3_scan_result_uri "${MODEL_ID}" "${VERSION}")
        SCORE_FILE="${DEST}/score.json"

        if [[ ! -f "${SCORE_FILE}" ]]; then
          echo "score.json missing at ${SCAN_URI}; refusing promote" >&2
          exit 1
        fi
        PASSED="$(jq -r '.passed // false' "${SCORE_FILE}")"
        ROUTING="$(jq -r '.routing // empty' "${SCORE_FILE}")"
        if [[ "${ROUTING}" != "auto-pass" && "${ROUTING}" != "review" ]]; then
          echo "refusing promote: passed=${PASSED} routing=${ROUTING}" >&2
          exit 1
        fi

        S3_URI=$(s3_promote_verified "${MODEL_ID}" "${VERSION}" "${MODEL_PATH}")
        echo "Promoted weights to ${S3_URI} (routing=${ROUTING})"

        export MR_URL S3_URI SCAN_URI VERSION ROUTING MODEL_ID
        python3 /opt/register/register_model.py

        python3 - <<PY
        import json
        payload = {
          "status": "${ROUTING}",
          "routing": "${ROUTING}",
          "published_uri": "${S3_URI}",
          "scan_uri": "${SCAN_URI}",
          "model_registry_namespace": "${MR_NS}",
          "model_version": "${VERSION}",
        }
        with open("${DEST}/publish.json", "w") as fh:
            json.dump(payload, fh, indent=2)
        print(json.dumps(payload))
        PY
        s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${DEST}/publish.json"
        echo -n "${S3_URI}" > "$(results.published-uri.path)"
        echo -n "${VERSION}" > "$(results.model-version.path)"
        echo -n "${SCAN_URI}" > "$(results.scan-uri.path)"
        printf '%s' "${S3_URI}" > /scratch/published-uri
    - name: clone-patch-test
      image: $(params.image)
      imagePullPolicy: IfNotPresent
      env:
      - name: GIT_TOKEN
        valueFrom:
          secretKeyRef:
            name: git-auth
            key: token
            optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        GIT_URL="$(params.git-url)"
        if [[ -z "${GIT_URL}" ]]; then
          echo "git-url empty; skipping model-test LLMInferenceService apply" >&2
          exit 0
        fi
        MODEL_ID="$(params.model-id)"
        PR="$(params.pipeline-run-name)"
        if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
        VERSION="${PR: -5}"
        URI="s3://models-verified/${MODEL_ID}/${VERSION}/"
        if [[ -f /scratch/published-uri ]]; then
          GOT="$(cat /scratch/published-uri)"
          if [[ -n "${GOT}" ]]; then URI="${GOT}"; fi
        fi
        OUT="/scratch/patched-test"
        APPLY="/scratch/patched-test-apply"
        rm -rf "${OUT}" "${APPLY}"
        mkdir -p "${APPLY}"
        export GIT_URL
        export GIT_PATH="$(params.model-test-path)"
        export GIT_REVISION="$(params.git-revision)"
        export OUT_DIR="${OUT}"
        unset NAME MODEL_NAME
        export MODEL_URI="${URI}"
        export MODEL_VERSION="${VERSION}"
        export NAMESPACE="$(params.test-namespace)"
        /scripts/clone-and-patch-llmis.sh
        cp -a "${OUT}/." "${APPLY}/"
    - name: apply-test
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      imagePullPolicy: IfNotPresent
      envFrom:
      - secretRef:
          name: minio-s3
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        NS="$(params.test-namespace)"
        DIR="/scratch/patched-test-apply"
        if [[ ! -d "${DIR}" ]] || [[ -z "$(ls -A "${DIR}" 2>/dev/null || true)" ]]; then
          echo "no patched model-test YAML; skip apply" >&2
          exit 0
        fi
        ENDPOINT="${AWS_ENDPOINT_URL:-${MINIO_ENDPOINT:-http://minio.minio-system.svc:9000}}"
        HTTPS=0
        case "${ENDPOINT}" in https://*) HTTPS=1 ;; esac
        HOSTPORT="${ENDPOINT#http://}"
        HOSTPORT="${HOSTPORT#https://}"
        HOSTPORT="${HOSTPORT%/}"
        oc create secret generic minio-s3 -n "${NS}" \
          --from-literal=MINIO_ENDPOINT="${MINIO_ENDPOINT:-${ENDPOINT}}" \
          --from-literal=AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
          --from-literal=AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
          --from-literal=AWS_REGION="${AWS_REGION:-us-east-1}" \
          --from-literal=AWS_ENDPOINT_URL="${ENDPOINT}" \
          --from-literal=AWS_DEFAULT_REGION="${AWS_REGION:-us-east-1}" \
          --from-literal=S3_USE_HTTPS="${HTTPS}" \
          --from-literal=S3_VERIFY_SSL="0" \
          --from-literal=AWS_S3_FORCE_PATH_STYLE="true" \
          --dry-run=client -o yaml | oc apply -f -
        oc annotate secret minio-s3 -n "${NS}" --overwrite \
          "serving.kserve.io/s3-endpoint=${HOSTPORT}" \
          "serving.kserve.io/s3-usehttps=${HTTPS}" \
          "serving.kserve.io/s3-region=${AWS_REGION:-us-east-1}" \
          "serving.kserve.io/s3-verifyssl=0" \
          "serving.kserve.io/s3-useanoncredential=false" \
          "serving.kserve.io/s3-usevirtualbucket=false" || true
        oc apply -n "${NS}" -f "${DIR}"
        echo "applied LLMInferenceService in ${NS}"
