apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: red-team
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  description: Adversarial probing and guardrail checks.
  params:
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/model-eval/ai-security-red-team:latest
    - name: model-path
      type: string
      default: /workspace/models
  results:
    - name: result-file
  workspaces:
    - name: models
    - name: results
  steps:
    - name: red-team
      image: $(params.image)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        OUT="$(workspaces.results.path)/redteam.json"
        /scripts/run-red-team.sh "$(workspaces.results.path)" "${OUT}"
        echo -n "${OUT}" > "$(results.result-file.path)"
