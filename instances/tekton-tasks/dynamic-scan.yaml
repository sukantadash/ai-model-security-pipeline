apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: dynamic-scan-isolated-runtime
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: dynamic-scan
spec:
  description: Dynamic-scan subtask — inspect the sandbox LLMInferenceService pod.
  params:
  - name: image
    type: string
    default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-dynamic-test:latest
  - name: model-id
    type: string
    default: unit-test
  - name: pipeline-run-name
    type: string
    default: ''
  - name: sandbox-namespace
    type: string
    default: model-sandbox
  - name: service-name
    type: string
    default: ''
    description: LLMInferenceService name from serve-llm-start (empty for unit fixtures)
  results:
  - name: result-file
    description: Path to isolated-runtime findings JSON
  workspaces:
  - name: models
  - name: results
  steps:
  - name: inspect
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      DIR="$(workspaces.results.path)/sandbox-inspect"
      mkdir -p "${DIR}"
      NS="$(params.sandbox-namespace)"
      NAME="$(params.service-name)"
      if [[ -z "${NAME}" ]]; then
        echo '{"kind":"List","items":[]}' > "${DIR}/llmis.json"
        echo '{"kind":"List","items":[]}' > "${DIR}/pods.json"
        echo '{"kind":"List","items":[]}' > "${DIR}/networkpolicies.json"
        echo '{"kind":"List","items":[]}' > "${DIR}/events.json"
        echo "unit fixture: skip cluster inspect"
        exit 0
      fi
      oc --request-timeout=20s get llminferenceservice "${NAME}" -n "${NS}" -o json > "${DIR}/llmis.json" || echo '{"kind":"Status"}' > "${DIR}/llmis.json"
      oc --request-timeout=20s get pods -n "${NS}" -l "app.kubernetes.io/name=${NAME}" -o json > "${DIR}/pods.json" || true
      if [[ ! -s "${DIR}/pods.json" ]] || ! grep -q '"items"' "${DIR}/pods.json"; then
        oc --request-timeout=20s get pods -n "${NS}" -o json > "${DIR}/pods.json" || echo '{"items":[]}' > "${DIR}/pods.json"
      fi
      oc --request-timeout=20s get networkpolicy -n "${NS}" -o json > "${DIR}/networkpolicies.json" || echo '{"items":[]}' > "${DIR}/networkpolicies.json"
      oc --request-timeout=20s get events -n "${NS}" -o json > "${DIR}/events.json" || echo '{"items":[]}' > "${DIR}/events.json"
    onError: continue
  - name: scan
    image: $(params.image)
    env:
    - name: RUNTIME_CLASS
      value: kata
    - name: SANDBOX_INSPECT_DIR
      value: $(workspaces.results.path)/sandbox-inspect
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      trap 'echo $? > "$(workspaces.results.path)/.step-rc"' EXIT
      OUT="$(workspaces.results.path)/dynamic-isolated-runtime.json"
      NAME="$(params.service-name)"
      if [[ -z "${NAME}" ]]; then
        unset SANDBOX_INSPECT_DIR
      fi
      /scripts/run-isolated-runtime.sh "${OUT}"
      echo -n "${OUT}" > "$(results.result-file.path)"
    onError: continue
  - name: upload
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    imagePullPolicy: IfNotPresent
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      FILE="$(workspaces.results.path)/dynamic-isolated-runtime.json"
      s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${FILE}"
  - name: fail-if-prior-failed
    image: $(params.image)
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      rc="$(cat "$(workspaces.results.path)/.step-rc" 2>/dev/null || echo 1)"
      exit "${rc}"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
