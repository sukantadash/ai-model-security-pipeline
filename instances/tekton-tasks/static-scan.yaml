apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: static-scan-malware
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: static-scan
spec:
  description: Static-scan subtask — malware (Magika, ModelAudit, Fickling, ModelScan, ClamAV).
  params:
  - name: image
    type: string
    default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-static-scan:latest
  - name: model-path
    type: string
    default: /workspace/models
  - name: fail-on-immediate
    type: string
    default: 'true'
    description: Exit 1 on ModelAudit exec/eval, ClamAV malware, or required tool missing.
  - name: model-id
    type: string
    default: unit-test
  - name: pipeline-run-name
    type: string
    default: ''
  results:
  - name: result-file
    description: Path to malware issues JSON
  workspaces:
  - name: models
  - name: results
  steps:
  - name: scan
    image: $(params.image)
    env:
    - name: STATIC_SCAN_IMMEDIATE_FAIL
      value: $(params.fail-on-immediate)
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      trap 'echo $? > "$(workspaces.results.path)/.step-rc"' EXIT
      OUT="$(workspaces.results.path)/static-malware.json"
      set +e
      /scripts/run-static-scan.sh "$(params.model-path)" "${OUT}" malware
      rc=$?
      set -e
      echo -n "${OUT}" > "$(results.result-file.path)"
      exit "${rc}"
    onError: continue
  - name: upload
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    imagePullPolicy: IfNotPresent
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      FILE="$(workspaces.results.path)/static-malware.json"
      s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${FILE}"
  - name: fail-if-prior-failed
    image: $(params.image)
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      rc="$(cat "$(workspaces.results.path)/.step-rc" 2>/dev/null || echo 1)"
      exit "${rc}"
---
