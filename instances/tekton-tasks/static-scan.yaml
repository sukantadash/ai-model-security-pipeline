apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: static-scan-merge
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/stage: static-scan
spec:
  description: Merge malware, vulnerabilities, and license-compliance JSON. Always succeeds; the Pipeline DAG shows static-scan
    after the three parallel tasks.
  params:
  - name: image
    type: string
    default: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-static-scan:latest
  - name: model-id
    type: string
    default: unit-test
  - name: pipeline-run-name
    type: string
    default: ''
  results:
  - name: result-file
    description: Path to merged static-scan findings JSON
  workspaces:
  - name: results
  steps:
  - name: download
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    imagePullPolicy: IfNotPresent
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      s3_fetch_scan_prefix "${MODEL_ID}" "${VERSION}" "$(workspaces.results.path)"
  - name: merge
    image: $(params.image)
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      OUT="$(workspaces.results.path)/static-scan.json"
      RESULTS="$(workspaces.results.path)"
      python3 - "${RESULTS}" "${OUT}" <<'PY'
      import json, sys
      from pathlib import Path
      FILES = {
          "malware": "static-malware.json",
          "vulnerabilities": "static-vulnerabilities.json",
          "license-compliance": "static-license-compliance.json",
      }
      results, out = Path(sys.argv[1]), Path(sys.argv[2])
      merged = []
      for subtask, filename in FILES.items():
          path = results / filename
          if not path.exists():
              merged.append({
                  "issue": f"subtask {subtask} produced no findings file",
                  "risk": "critical",
                  "tool": "static-scan-merge",
                  "task": "static-scan",
                  "subtask": subtask,
              })
              continue
          payload = json.loads(path.read_text() or "{}")
          issues = payload.get("issues") if isinstance(payload, dict) else payload
          merged.extend(issues or [])
      out.write_text(json.dumps(merged, indent=2) + "\n")
      print(out.read_text())
      PY
      echo -n "${OUT}" > "$(results.result-file.path)"
  - name: upload
    image: image-registry.openshift-image-registry.svc:5000/build-image/ai-security-publish:latest
    imagePullPolicy: IfNotPresent
    envFrom:
    - secretRef:
        name: minio-s3
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      source /scripts/s3-common.sh
      MODEL_ID="$(params.model-id)"
      PR="$(params.pipeline-run-name)"
      if [[ -z "${PR}" ]]; then PR="$(context.taskRun.name)"; fi
      VERSION="$(model_version_from_run "${PR}")"
      FILE="$(workspaces.results.path)/static-scan.json"
      s3_put_scan_result "${MODEL_ID}" "${VERSION}" "${FILE}"
