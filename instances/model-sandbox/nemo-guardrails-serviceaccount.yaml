# NeMo Guardrails service account + API token (RHOAI 3.2 Guardrails guide, ch. 3.2 steps 1–5).
# The NemoGuardrails CR reads OPENAI_API_KEY from Secret nemo-guardrails-api-token/token
# and sends it as the bearer token to the model predictor.
#
# The guide mints the token with `oc create token --duration=8760h`, which expires
# silently after a year. Here a service-account-token Secret is used instead so the
# token controller keeps it populated; the account is bound to ClusterRole view only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nemo-guardrails-service-account
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/component: nemo-guardrails
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nemo-guardrails-service-account-view
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/component: nemo-guardrails
subjects:
  - kind: ServiceAccount
    name: nemo-guardrails-service-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: v1
kind: Secret
metadata:
  name: nemo-guardrails-api-token
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    ai.security.pipeline/component: nemo-guardrails
  annotations:
    kubernetes.io/service-account.name: nemo-guardrails-service-account
type: kubernetes.io/service-account-token
