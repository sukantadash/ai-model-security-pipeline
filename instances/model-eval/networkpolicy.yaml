# Evaluation zone: isolated from production; may reach ingress (artifact sync), internal registry, and Quay.
# Per HLD §4.2 / IMPLEMENTATION-PLAN §3: no general public internet — Quay + cluster services only.
# Image builds run in build-image namespace (no NetworkPolicy there).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-namespace
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              security.platform/zone: ingress
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              security.platform/zone: ingress
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: dns
        - protocol: TCP
          port: dns-tcp
    - to:
        - ipBlock:
            cidr: 172.30.0.0/16
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API + in-cluster services on ClusterIPs (OVN may not match 0.0.0.0/0).
    - to:
        - ipBlock:
            cidr: 172.30.0.0/16
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-pipelines
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-system
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rhoai-model-registries
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              security.platform/zone: sandbox
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 443
