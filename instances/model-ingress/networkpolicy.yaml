# Deny cross-namespace traffic; allow same-namespace pods, DNS, internal registry, and Hugging Face Hub.
# Per HLD §4.1: ingress zone may reach HF Hub only (HTTPS egress).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-cross-namespace
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: dns
        - protocol: TCP
          port: dns-tcp
    # ClusterIP path (dns-default service) — service network is 172.30.0.0/16 on default OCP installs.
    - to:
        - ipBlock:
            cidr: 172.30.0.0/16
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 172.30.0.0/16
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-system
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
