apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Explicit namespace so PVC/NetworkPolicy land in model-ingress under Argo
# (ai-sec-model-ingress) without relying on oc -n.
# ModelCar build context (ConfigMap) + SA live here; the one-shot Job stays in
# instances/model-ingress-fetch/model-fetch-job.yaml (manual Phase 5 apply).
namespace: model-ingress

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - ingress-models-pvc.yaml
  - serviceaccount.yaml

configMapGenerator:
  - name: modelcar-build
    files:
      - Containerfile
      - download_model.py
      - build-modelcar.sh
    options:
      disableNameSuffixHash: true
