# UNUSED — not referenced by kustomization.yaml.
# NVIDIADriver CR conflicts with ClusterPolicy-managed driver daemonsets (anti-affinity).
# Prefer ClusterPolicy driver settings in cluster-policy.yaml (version 580.178.04, proprietary).
# Keep this file only as a reference; do not re-add to kustomization without useNvidiaDriverCRD: true
# and disabling the ClusterPolicy driver path.
kind: NVIDIADriver
apiVersion: nvidia.com/v1alpha1
metadata:
  name: gpu-driver
spec:
  driverType: gpu
  repository: nvcr.io/nvidia
  image: driver
  version: "580.178.04"
  kernelModuleType: proprietary
  nodeSelector: {}
  manager: {}
  repoConfig:
    name: ''
  certConfig:
    name: ''
  licensingConfig:
    nlsEnabled: true
    name: ''
  virtualTopologyConfig:
    name: ''
  kernelModuleConfig:
    name: ''
