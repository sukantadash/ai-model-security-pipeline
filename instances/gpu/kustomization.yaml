# Apply after NFD and GPU Operator subscriptions are installed (overlays/00-gpu-operators).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nodefeaturediscovery.yaml
  - cluster-policy.yaml
  # driver.yaml (NVIDIADriver CR) intentionally omitted: use ClusterPolicy driver only.
  # Parallel NVIDIADriver + ClusterPolicy daemonsets fight for the GPU node (anti-affinity).
