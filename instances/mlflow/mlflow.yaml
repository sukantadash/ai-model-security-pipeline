# MLflow tracking server (RHOAI 3.5 "Working with MLflow", ch. 2). Cluster-scoped; must be named mlflow.
# The MLflow operator (DSC component mlflowoperator) runs it in redhat-ods-applications and the
# dashboard shows it under Develop & train → Experiments (MLflow). Every project is a workspace;
# the pipeline logs to workspace model-eval (see instances/pipeline-rbac/mlflow-rolebinding.yaml).
#
# Lab sizing: SQLite on a PVC for run metadata, MinIO bucket "mlflow" for artifacts, 1 replica.
# For HA use PostgreSQL (backendStoreUriFrom) and replicas > 1, as in the guide's production example.
#
# Requires Secret mlflow-s3-credentials in redhat-ods-applications (MinIO keys; created from .env by
# deploy.sh step 9 / gitops-scripts.sh Phase 2 — not in Git).
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  replicas: 1
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "s3://mlflow/artifacts"
  serveArtifacts: true
  envFrom:
    - secretRef:
        name: mlflow-s3-credentials
  # The operator manages a NetworkPolicy for the server; let it reach MinIO for artifacts.
  networkPolicyAdditionalEgressRules:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio-system
      ports:
        - protocol: TCP
          port: 9000
