# Example PipelineRun for RedHatAI/Qwen3-8B-FP8-dynamic — edit model-id if needed, then:
#   oc create -f instances/tekton-pipeline/pipelinerun-example.yaml
#
# Prerequisites:
#   - model-fetch Job completed (MinIO models-ingress/redhatai-qwen3-8b-fp8-dynamic/)
#   - minio-s3 secret in model-eval and model-sandbox
#   - oc apply -k instances/model-sandbox/ (namespace persists)
#   - Scanner + publish images built (Phase 5)
#   - git-url reachable from model-eval (HTTPS)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: model-security-
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  pipelineRef:
    name: model-security-pipeline
  taskRunTemplate:
    serviceAccountName: model-eval-pipeline
  params:
    - name: model-id
      value: redhatai-qwen3-8b-fp8-dynamic
    - name: model-path
      value: /workspace/models
    - name: git-url
      value: https://github.com/sukantadash/ai-model-security-pipeline.git
    - name: model-sandbox-path
      value: instances/model-sandbox
    - name: model-test-path
      value: instances/model-test
  workspaces:
    - name: shared-data
      persistentVolumeClaim:
        claimName: eval-workspace
    - name: results
      emptyDir: {}
