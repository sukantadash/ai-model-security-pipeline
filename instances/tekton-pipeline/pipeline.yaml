apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: model-security-pipeline
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  description: Validate model artifacts from MinIO ingress through security tasks; promote to Model Registry on pass.
  params:
    - name: model-id
      type: string
      description: Storage key under models-ingress/ (e.g. redhatai-qwen3-8b-fp8-dynamic)
    - name: model-path
      type: string
      default: /workspace/models
    - name: model-registry-namespace
      type: string
      default: rhoai-model-registries
    - name: git-url
      type: string
      default: https://github.com/sukantadash/ai-model-security-pipeline.git
      description: Git repo that holds serving YAML (LLMInferenceService templates)
    - name: model-sandbox-path
      type: string
      default: instances/model-sandbox
      description: Path in git-url to sandbox manifests
    - name: model-test-path
      type: string
      default: instances/model-test/llm-models
      description: Path in git-url to verified serving manifests
    - name: git-revision
      type: string
      default: ''
    - name: sandbox-namespace
      type: string
      default: model-sandbox
    - name: test-namespace
      type: string
      default: model-test
  workspaces:
  - name: shared-data
    description: eval-workspace PVC for model weights only (scan JSON is in MinIO models-eval)
  - name: results
    description: Pod-local emptyDir for scan JSON before S3 upload; not shared across TaskRuns
  tasks:
  - name: fetch-artifact
    taskRef:
      name: fetch-artifact
    params:
    - name: model-id
      value: $(params.model-id)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
  - name: malware
    retries: 2
    runAfter:
    - fetch-artifact
    taskRef:
      name: static-scan-malware
    params:
    - name: model-path
      value: $(params.model-path)
    - &id001
      name: model-id
      value: $(params.model-id)
    - &id002
      name: pipeline-run-name
      value: $(context.pipelineRun.name)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: vulnerabilities
    retries: 2
    runAfter:
    - fetch-artifact
    taskRef:
      name: static-scan-vulnerabilities
    params:
    - name: model-path
      value: $(params.model-path)
    - *id001
    - *id002
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: license-compliance
    retries: 2
    runAfter:
    - fetch-artifact
    taskRef:
      name: static-scan-license-compliance
    params:
    - name: model-path
      value: $(params.model-path)
    - *id001
    - *id002
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: static-scan
    runAfter:
    - malware
    - vulnerabilities
    - license-compliance
    taskRef:
      name: static-scan-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: serve-llm-start
    runAfter:
    - static-scan
    taskRef:
      name: serve-llm-start
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: git-url
      value: $(params.git-url)
    - name: model-sandbox-path
      value: $(params.model-sandbox-path)
    - name: git-revision
      value: $(params.git-revision)
    - name: namespace
      value: $(params.sandbox-namespace)
  - name: isolated-runtime
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-isolated-runtime
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: sandbox-namespace
      value: $(params.sandbox-namespace)
    - name: service-name
      value: $(tasks.serve-llm-start.results.service-name)
  - name: behavior
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-behavior
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: sandbox-namespace
      value: $(params.sandbox-namespace)
    - name: service-name
      value: $(tasks.serve-llm-start.results.service-name)
  - name: abnormal-resources
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-abnormal-resources
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: sandbox-namespace
      value: $(params.sandbox-namespace)
    - name: service-name
      value: $(tasks.serve-llm-start.results.service-name)
  - name: basic-inference
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-basic-inference
    params:
    - name: model-path
      value: $(params.model-path)
    - *id001
    - *id002
    - &id003
      name: model-endpoint
      value: $(tasks.serve-llm-start.results.endpoint-url)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: dynamic-scan
    runAfter:
    - isolated-runtime
    - behavior
    - abnormal-resources
    - basic-inference
    taskRef:
      name: dynamic-scan-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: quality
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-quality
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: performance-cost
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-performance-cost
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: stability-check
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-stability
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: anomaly-bias-detection
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-anomaly-bias
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: capability-eval
    runAfter:
    - quality
    - performance-cost
    - stability-check
    - anomaly-bias-detection
    taskRef:
      name: capability-eval-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: prompt-injection
    retries: 2
    runAfter:
    - capability-eval
    taskRef:
      name: adversarial-test-prompt-injection
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: jailbreak-guardrail-bypass
    retries: 2
    runAfter:
    - capability-eval
    taskRef:
      name: adversarial-test-jailbreak-guardrail-bypass
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: harmful-content-bias
    retries: 2
    runAfter:
    - capability-eval
    taskRef:
      name: adversarial-test-harmful-content-bias
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: adversarial-test
    runAfter:
    - prompt-injection
    - jailbreak-guardrail-bypass
    - harmful-content-bias
    taskRef:
      name: adversarial-test-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: score-gate
    runAfter:
    - adversarial-test
    taskRef:
      name: score-gate
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: publish-artifact
    runAfter:
    - score-gate
    when:
    - input: $(tasks.score-gate.results.routing)
      operator: in
      values:
      - auto-pass
      - review
    taskRef:
      name: publish-artifact
    params:
    - name: model-id
      value: $(params.model-id)
    - name: model-registry-namespace
      value: $(params.model-registry-namespace)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: git-url
      value: $(params.git-url)
    - name: model-test-path
      value: $(params.model-test-path)
    - name: git-revision
      value: $(params.git-revision)
    - name: test-namespace
      value: $(params.test-namespace)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
  finally:
  - name: serve-llm-stop
    taskRef:
      name: serve-llm-stop
    params:
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: namespace
      value: $(params.sandbox-namespace)
  - name: archive-results
    taskRef:
      name: archive-results
    params:
    - name: model-id
      value: $(params.model-id)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
