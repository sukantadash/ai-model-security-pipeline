apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: model-security-pipeline
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
spec:
  description: >
    Validate ModelCar weights (${model-id}-unverified) through security tasks; on pass
    retag to ${model-id}-verified-SCORE-VERSION and apply caller-supplied serving YAML.
  params:
    - name: model-id
      type: string
      description: Model id (must match model-fetch Job MODEL_ID); used in image tags
    - name: modelcar-image
      type: string
      description: Shared ModelCar repository, e.g. quay.io/sudash/ai-model-security-pipeline
    - name: model-path
      type: string
      default: /workspace/models
    - name: model-registry-namespace
      type: string
      default: rhoai-model-registries
    - name: git-url
      type: string
      default: https://github.com/sukantadash/ai-model-security-pipeline.git
      description: Git repo that holds serving YAML (LLMInferenceService with oci://PLACEHOLDER)
    - name: model-sandbox-path
      type: string
      default: instances/model-sandbox/LLMInferenceService.yaml
      description: File path in git-url to sandbox LLMInferenceService YAML
    - name: serving-yaml
      type: string
      default: instances/model-test/qwen3-8b-fp8-verified.yaml
      description: File path in git-url to verified LLMInferenceService YAML (placeholder image only)
    - name: git-revision
      type: string
      default: ''
    - name: sandbox-namespace
      type: string
      default: model-sandbox
    - name: test-namespace
      type: string
      default: model-test
    - name: nemo-guardrails-enabled
      type: string
      default: 'true'
      description: >
        "true" deploys NeMo Guardrails in front of the sandbox model (adversarial subtask
        nemo-guardrails) and in front of the verified model in test-namespace after publish.
    - name: test-guardrails-name
      type: string
      default: nemo-guardrails
      description: NemoGuardrails CR / Service / Route name in test-namespace
  workspaces:
  - name: shared-data
    description: eval-workspace PVC for model weights only (scan JSON is in MinIO models-eval)
  - name: results
    description: Pod-local emptyDir for scan JSON before S3 upload; not shared across TaskRuns
  tasks:
  - name: fetch-artifact
    # The Task itself retries the extract 4x; this re-runs the whole TaskRun if the pod dies.
    retries: 2
    taskRef:
      name: fetch-artifact
    params:
    - name: model-id
      value: $(params.model-id)
    - name: modelcar-image
      value: $(params.modelcar-image)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
  - name: malware
    retries: 2
    runAfter:
    - fetch-artifact
    taskRef:
      name: static-scan-malware
    params:
    - name: model-path
      value: $(params.model-path)
    - &id001
      name: model-id
      value: $(params.model-id)
    - &id002
      name: pipeline-run-name
      value: $(context.pipelineRun.name)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: vulnerabilities
    retries: 2
    runAfter:
    - fetch-artifact
    taskRef:
      name: static-scan-vulnerabilities
    params:
    - name: model-path
      value: $(params.model-path)
    - *id001
    - *id002
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: license-compliance
    retries: 2
    runAfter:
    - fetch-artifact
    taskRef:
      name: static-scan-license-compliance
    params:
    - name: model-path
      value: $(params.model-path)
    - *id001
    - *id002
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: static-scan
    runAfter:
    - malware
    - vulnerabilities
    - license-compliance
    taskRef:
      name: static-scan-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: serve-llm-start
    runAfter:
    - static-scan
    taskRef:
      name: serve-llm-start
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: git-url
      value: $(params.git-url)
    - name: modelcar-image
      value: $(params.modelcar-image)
    - name: model-sandbox-path
      value: $(params.model-sandbox-path)
    - name: git-revision
      value: $(params.git-revision)
    - name: namespace
      value: $(params.sandbox-namespace)
  - name: isolated-runtime
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-isolated-runtime
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: sandbox-namespace
      value: $(params.sandbox-namespace)
    - name: service-name
      value: $(tasks.serve-llm-start.results.service-name)
  - name: behavior
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-behavior
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: sandbox-namespace
      value: $(params.sandbox-namespace)
    - name: service-name
      value: $(tasks.serve-llm-start.results.service-name)
  - name: abnormal-resources
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-abnormal-resources
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - name: sandbox-namespace
      value: $(params.sandbox-namespace)
    - name: service-name
      value: $(tasks.serve-llm-start.results.service-name)
  - name: basic-inference
    retries: 2
    runAfter:
    - serve-llm-start
    taskRef:
      name: dynamic-scan-basic-inference
    params:
    - name: model-path
      value: $(params.model-path)
    - *id001
    - *id002
    - &id003
      name: model-endpoint
      value: $(tasks.serve-llm-start.results.endpoint-url)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
  - name: dynamic-scan
    runAfter:
    - isolated-runtime
    - behavior
    - abnormal-resources
    - basic-inference
    taskRef:
      name: dynamic-scan-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: nemo-guardrails-start
    runAfter:
    - dynamic-scan
    taskRef:
      name: nemo-guardrails-deploy
    params:
    - name: enabled
      value: $(params.nemo-guardrails-enabled)
    - name: namespace
      value: $(params.sandbox-namespace)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: model-id
      value: $(params.model-id)
    - name: model-endpoint
      value: $(tasks.serve-llm-start.results.endpoint-url)
    - name: llmis-name
      value: $(tasks.serve-llm-start.results.service-name)
    - name: enable-auth
      value: 'false'
  - name: quality
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-quality
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: performance-cost
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-performance-cost
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: stability-check
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-stability
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: anomaly-bias-detection
    retries: 2
    runAfter:
    - dynamic-scan
    taskRef:
      name: capability-eval-anomaly-bias
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: capability-eval
    runAfter:
    - quality
    - performance-cost
    - stability-check
    - anomaly-bias-detection
    taskRef:
      name: capability-eval-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: prompt-injection
    retries: 2
    runAfter:
    - capability-eval
    taskRef:
      name: adversarial-test-prompt-injection
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: jailbreak-guardrail-bypass
    retries: 2
    runAfter:
    - capability-eval
    taskRef:
      name: adversarial-test-jailbreak-guardrail-bypass
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: harmful-content-bias
    retries: 2
    runAfter:
    - capability-eval
    taskRef:
      name: adversarial-test-harmful-content-bias
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
  - name: nemo-guardrails
    retries: 2
    runAfter:
    - capability-eval
    - nemo-guardrails-start
    taskRef:
      name: adversarial-test-nemo-guardrails
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
    - *id003
    - name: guardrails-endpoint
      value: $(tasks.nemo-guardrails-start.results.endpoint-url)
    - name: guardrails-enabled
      value: $(params.nemo-guardrails-enabled)
  - name: adversarial-test
    runAfter:
    - prompt-injection
    - jailbreak-guardrail-bypass
    - harmful-content-bias
    - nemo-guardrails
    taskRef:
      name: adversarial-test-merge
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: score-gate
    runAfter:
    - adversarial-test
    taskRef:
      name: score-gate
    workspaces:
    - name: results
      workspace: results
    params:
    - *id001
    - *id002
  - name: publish-artifact
    runAfter:
    - score-gate
    when:
    - input: $(tasks.score-gate.results.routing)
      operator: in
      values:
      - auto-pass
      - review
    taskRef:
      name: publish-artifact
    params:
    - name: model-id
      value: $(params.model-id)
    - name: modelcar-image
      value: $(params.modelcar-image)
    - name: model-registry-namespace
      value: $(params.model-registry-namespace)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: git-url
      value: $(params.git-url)
    - name: serving-yaml
      value: $(params.serving-yaml)
    - name: git-revision
      value: $(params.git-revision)
    - name: test-namespace
      value: $(params.test-namespace)
    workspaces:
    - name: models
      workspace: shared-data
      subPath: models
  - name: nemo-guardrails-test
    runAfter:
    - publish-artifact
    when:
    - input: $(tasks.score-gate.results.routing)
      operator: in
      values:
      - auto-pass
      - review
    - input: $(params.nemo-guardrails-enabled)
      operator: in
      values:
      - 'true'
    taskRef:
      name: nemo-guardrails-deploy
    params:
    - name: enabled
      value: $(params.nemo-guardrails-enabled)
    - name: namespace
      value: $(params.test-namespace)
    - name: name
      value: $(params.test-guardrails-name)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: model-id
      value: $(params.model-id)
    - name: enable-auth
      value: 'true'
    # First pull of the ~9 GB ModelCar on the model-test GPU node can exceed the 900s default.
    - name: wait-timeout
      value: 1800s
  finally:
  - name: nemo-guardrails-stop
    taskRef:
      name: nemo-guardrails-delete
    params:
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: namespace
      value: $(params.sandbox-namespace)
  - name: serve-llm-stop
    taskRef:
      name: serve-llm-stop
    params:
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)
    - name: namespace
      value: $(params.sandbox-namespace)
  - name: archive-results
    taskRef:
      name: archive-results
    params:
    - name: model-id
      value: $(params.model-id)
    - name: pipeline-run-name
      value: $(context.pipelineRun.name)