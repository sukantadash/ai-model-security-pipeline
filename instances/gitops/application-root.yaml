# App-of-Apps root — syncs instances/gitops/apps (all child Applications).
# Prerequisites: OpenShift GitOps operator Ready. Apply once:
#   oc apply -k ./instances/gitops/
#   # or: ./gitops-scripts.sh
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-model-security-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: zqlk8.sandbox425.opentlc.com
    path: instances/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
    automated:
      prune: true
      selfHeal: true
