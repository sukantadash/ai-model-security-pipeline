# Sync wave 1 — GPU ClusterPolicy / NFD instances (script.sh Phase 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-01-gpu-instances
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arckrish/ai-model-security-pipeline.git
    targetRevision: multi-model-support
    path: overlays/01-gpu-instances
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu-operator
  # Operator mutates defaults / drops deprecated fields → perpetual OutOfSync without these.
  ignoreDifferences:
    - group: nfd.openshift.io
      kind: NodeFeatureDiscovery
      jsonPointers:
        - /spec/customConfig
        - /spec/enableTaints
        - /spec/prunerOnDelete
        - /spec/topologyUpdater
    - group: nvidia.com
      kind: ClusterPolicy
      jsonPointers:
        - /spec/driver/kernelModuleType
        - /spec/driver/upgradePolicy/kernelModuleType
        - /spec/operator/runtimeClass
        - /spec/toolkit/installDir
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
