# Sync wave 1 — GPU ClusterPolicy / NFD instances (script.sh Phase 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-01-gpu-instances
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: main
    path: overlays/01-gpu-instances
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu-operator
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
