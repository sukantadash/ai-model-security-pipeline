# Sync wave 3 — eval/sandbox/test/build-image namespaces + pipeline RBAC (script.sh Phase 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-04-zones
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: zqlk8.sandbox425.opentlc.com
    path: overlays/04-zones
  destination:
    server: https://kubernetes.default.svc
    namespace: model-eval
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
