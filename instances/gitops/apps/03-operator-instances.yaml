# Sync wave 4 — Tekton Chains, Service Mesh, KataConfig, … (script.sh Phase 3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-03-operator-instances
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: main
    path: overlays/03-operator-instances
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
