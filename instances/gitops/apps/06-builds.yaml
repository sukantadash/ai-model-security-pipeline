# Sync wave 6 — ImageStreams + BuildConfigs in build-image (script.sh Phase 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-06-builds
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: main
    path: overlays/06-builds
  destination:
    server: https://kubernetes.default.svc
    namespace: build-image
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
