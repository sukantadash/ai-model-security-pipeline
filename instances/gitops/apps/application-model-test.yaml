# Sync wave 16 — optional GitOps view of verified serving YAML in model-test.
# publish-artifact oc-applies the patched YAML (placeholder → verified ModelCar tag).
# Automated sync is off so Argo does not overwrite the live URI with oci://PLACEHOLDER.
# Edit spec.source.repoURL to your fork before applying the App-of-Apps root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-test-verified-models
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "16"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/arckrish/ai-model-security-pipeline.git
    targetRevision: multi-model-support
    path: instances/model-test
    directory:
      include: qwen3-8b-fp8-verified.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: model-test
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
