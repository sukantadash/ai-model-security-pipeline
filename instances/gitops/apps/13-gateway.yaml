# Sync wave 13 — Inference gateway + TLS (script.sh Phase 12).
# Edit instances/gateway/gateway.yaml hostname before sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-13-gateway
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: zqlk8.sandbox425.opentlc.com
    path: overlays/13-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-ingress
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
