# Sync wave 5 — MinIO + eval workspace PVC (script.sh Phase 4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-05-storage
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: main
    path: overlays/05-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
