# Sync wave 8 — Tekton Pipeline in model-eval (script.sh Phase 7).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-sec-08-tekton-pipeline
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukantadash/ai-model-security-pipeline.git
    targetRevision: zqlk8.sandbox425.opentlc.com
    path: overlays/08-tekton-pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: model-eval
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
