# EventListener sink RBAC — namespaced triggers + PipelineRun create.
# Binds OpenShift Pipelines' tekton-triggers-eventlistener-roles ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-eval-pipeline-eventlistener
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
subjects:
  - kind: ServiceAccount
    name: model-eval-pipeline
