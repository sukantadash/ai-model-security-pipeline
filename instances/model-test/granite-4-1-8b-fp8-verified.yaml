# Verified serving YAML for Granite 4.1 8B FP8 (RedHatAI/granite-4.1-8b-fp8).
# Same as qwen3-8b-fp8-verified.yaml except names and --max-model-len 16384 (KV cache fits a 24 GB L4).
# publish-artifact replaces oci://PLACEHOLDER with
# oci://<MODELCAR_IMAGE>:<model-id>-verified-<score>-<version>. Pass this file path as serving-yaml.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: granite-4-1-8b-fp8
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    security.platform/zone: test
  annotations:
    opendatahub.io/hardware-profile-name: gpu-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    openshift.io/display-name: redhatai-granite-4-1-8b-fp8
    security.opendatahub.io/enable-auth: "false"
    security.platform/verified: "true"
    security.platform/source-pipeline: model-security-pipeline
    security.platform/model-registry: rhoai-model-registries
    security.platform/registered-model: redhatai-granite-4-1-8b-fp8
spec:
  baseRefs:
    - name: redhatai-granite-4-1-8b-fp8
  replicas: 1
  model:
    name: redhatai-granite-4-1-8b-fp8
    uri: oci://PLACEHOLDER
  router:
    gateway: {}
    route: {}
  template:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: --disable-uvicorn-access-log --max-model-len 16384
        resources:
          limits:
            cpu: "4"
            memory: 12Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
