# Build ModelCar from Hugging Face and push ${MODELCAR_IMAGE}:${MODEL_ID}-unverified (no MinIO weight upload).
#
# Prerequisites (synced by Argo ai-sec-model-ingress / instances/model-ingress):
#   - ServiceAccount model-fetch + ConfigMap modelcar-build (Containerfile)
#   - hf-token + Quay secret linked; privileged SCC (gitops-scripts.sh Phase 2)
#
# Usage (one-shot; not part of App-of-Apps):
#   oc delete job/model-fetch -n model-ingress --ignore-not-found
#   oc apply -f instances/model-ingress-fetch/model-fetch-job.yaml -n model-ingress
#   oc wait --for=condition=complete job/model-fetch -n model-ingress --timeout=7200s
#
# Override HF_REPO / MODEL_ID for other models (must match PipelineRun model-id).
# Pushes: ${MODELCAR_IMAGE}:${MODEL_ID}-unverified
apiVersion: batch/v1
kind: Job
metadata:
  name: model-fetch
  labels:
    app.kubernetes.io/part-of: ai-model-security-pipeline
    app.kubernetes.io/name: model-fetch
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-fetch
    spec:
      restartPolicy: Never
      serviceAccountName: model-fetch
      containers:
        - name: build
          image: quay.io/buildah/stable:v1.39.3
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          envFrom:
            - secretRef:
                name: hf-token
                optional: true
          env:
            - name: HF_REPO
              value: RedHatAI/Qwen3-8B-FP8-dynamic
            - name: MODEL_ID
              value: redhatai-qwen3-8b-fp8-dynamic
            # Shared repo; tag is ${MODEL_ID}-unverified
            - name: MODELCAR_IMAGE
              value: quay.io/sudash/ai-model-security-pipeline
            - name: CONTEXT_DIR
              value: /build
            - name: REGISTRY_AUTH_FILE
              value: /tmp/auth.json
          command:
            - /bin/bash
            - /build/build-modelcar.sh
          volumeMounts:
            - name: build-context
              mountPath: /build
            - name: quay-auth
              mountPath: /run/secrets/quay
              readOnly: true
            - name: var-lib-containers
              mountPath: /var/lib/containers
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 32Gi
      volumes:
        - name: build-context
          configMap:
            name: modelcar-build
            defaultMode: 0755
        - name: quay-auth
          secret:
            secretName: sudash-modelpipeline-pull-secret
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
        - name: var-lib-containers
          emptyDir:
            sizeLimit: 200Gi
        - name: tmp
          emptyDir:
            sizeLimit: 50Gi
