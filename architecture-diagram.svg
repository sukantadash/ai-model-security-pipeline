  <text x="532" y="442" fill="#141414" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tekton Chains</text>
  <text x="532" y="458" fill="#141414BD" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif">SLSA provenance + Cosign</text>

