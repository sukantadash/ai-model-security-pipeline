<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-label="AI Model Security Platform architecture">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#14141433"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="600" fill="#FCFCFC"/>

  <!-- Ingress Zone -->
  <rect x="24" y="48" width="220" height="520" rx="8" fill="#1414140F" stroke="#CF2D56" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="76" fill="#141414" font-size="14" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Ingress Zone</text>
  <text x="40" y="94" fill="#141414BD" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Untrusted artifact intake</text>

  <!-- Evaluation Zone -->
  <rect x="268" y="48" width="520" height="520" rx="8" fill="#1414140F" stroke="#3685BF" stroke-width="1.5"/>
