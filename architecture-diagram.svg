  <text x="852" y="248" fill="#141414BD" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif">OpenShift GitOps</text>

  <rect x="840" y="290" width="184" height="48" rx="6" fill="#FCFCFC" stroke="#1414141F" stroke-width="1"/>
  <text x="852" y="312" fill="#141414" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">KServe + vLLM</text>
  <text x="852" y="328" fill="#141414BD" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif">model-dev / model-prod</text>

  <rect x="840" y="370" width="184" height="48" rx="6" fill="#FCFCFC" stroke="#1414141F" stroke-width="1"/>
  <text x="852" y="392" fill="#141414" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">KEDA Autoscaler</text>
  <text x="852" y="408" fill="#141414BD" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif">GPU / queue depth</text>

  <rect x="840" y="450" width="184" height="48" rx="6" fill="#FCFCFC" stroke="#1414141F" stroke-width="1"/>
  <text x="852" y="472" fill="#141414" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Observability</text>
  <text x="852" y="488" fill="#141414BD" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Prometheus, Grafana, OTel</text>

  <text x="390" y="520" fill="#1414148A" font-size="10" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Tekton Tasks run in isolated namespace - no outbound egress except approved endpoints</text>
</svg>
