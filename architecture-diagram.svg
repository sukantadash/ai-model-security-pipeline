  <rect x="300" y="376" width="180" height="48" rx="6" fill="#14141414" stroke="#1414141F" stroke-width="1"/>
  <text x="312" y="398" fill="#141414" font-size="12" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif">Capability Evaluation</text>
  <text x="312" y="414" fill="#141414BD" font-size="10" font-family="system-ui, -apple-system, Segoe UI, sans-serif">lm-eval, DeepEval, TruLens</text>

