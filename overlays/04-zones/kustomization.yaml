# Phase 3: Security zones — namespaces, NetworkPolicies, pipeline RBAC, build-image NS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# model-ingress has no kustomize namespace field — apply it with
#   oc apply -k ./instances/model-ingress/ -n "${NS_MODEL_INGRESS}"
# (see script.sh Phase 2). Including it here would place NetworkPolicy in the
# current oc context.
resources:
  - ../../instances/model-eval
  - ../../instances/model-sandbox
  - ../../instances/model-test
  - ../../instances/pipeline-rbac
  # build-image namespace only (no zone NetworkPolicy) — secrets in Phase 4 before 06-builds.
  - ../../instances/build-image
