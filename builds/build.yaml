# OpenShift ImageStreams + BuildConfigs for AI Model Security Pipeline tasks.
#
# Source type is Binary — build from local context in build-image namespace (no NetworkPolicy):
#   oc apply -k ./overlays/06-builds/
#   oc apply -f quay-secret.yaml -n build-image
#   oc secrets link builder sudash-modelpipeline-pull-secret -n build-image
#   for bc in model-fetch static-scan dynamic-test dynamic-gpu capability-eval adversarial-test score-gate publish; do
#     oc start-build "ai-security-${bc}" --from-dir="builds/${bc}" --follow -n build-image
#   done
#
# Single image:
#   oc start-build ai-security-model-fetch --from-dir=builds/model-fetch --follow -n build-image

---
apiVersion: v1
kind: List
metadata:
  name: ai-security-builds
items:
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ai-security-model-fetch
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ai-security-model-fetch
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
    spec:
      output:
        to:
          kind: ImageStreamTag
          name: ai-security-model-fetch:latest
      source:
        type: Binary
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile

  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ai-security-static-scan
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ai-security-static-scan
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
    spec:
