  # --- capability-eval: lm-eval-harness, DeepEval ---
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ai-security-capability-eval
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ai-security-capability-eval
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
    spec:
