          ref: main
        contextDir: builds/static-scan
      strategy:
        type: Docker
        dockerStrategy:
          dockerfilePath: Dockerfile
      triggers:
        - type: ConfigChange

  # --- dynamic-test: vLLM load probe (GPU) ---
  - apiVersion: image.openshift.io/v1
    kind: ImageStream
    metadata:
      name: ai-security-dynamic-test
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
  - apiVersion: build.openshift.io/v1
    kind: BuildConfig
    metadata:
      name: ai-security-dynamic-test
      labels:
        app.kubernetes.io/part-of: ai-model-security-pipeline
    spec:
